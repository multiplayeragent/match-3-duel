<body>
<canvas id="game"></canvas>
<div id="safe" style="position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top);pointer-events:none"></div>

<script>
/* ═══ MATCH-3 DUEL · a Multiplayer Agent starter ═════════════════════════════════════════
 * Swap gems to match 3. Chains and big matches drop stones on your rivals. Versus, 2–4
 * players; bots fill empty seats. The stack rises from below: a full board loses.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ board size, rising speed, stones per chain, bots
 *   GEMS .......... the gem kinds: color and shape
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   BOARD ......... one board's rules: swapping, matching, falling, chains, rising rows, stones
 *   MATCH (HOST) .. countdown, who is out, the winner, the restart, sending stones
 *   BOTS (HOST) ... a bot tries every swap and plays one of the best
 *   ME ............ my board: ticking, my swaps, publishing
 *   RIVALS ........ other players' boards rebuilt from their snapshots, with smooth falls
 *   DRAW .......... gem pictures, boards (mine large, rivals small), effects
 *   SCREENS ....... sound, hint, results, leaderboard, colors
 *   INPUT ......... drag or tap two gems, keyboard cursor
 *   MAIN LOOP ..... heartbeat, host tick, my tick, draw
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player's board is its OWN entity field `b` = {m, g, n, r, a, s, j, q, c, k, u}:
 *     match id, the 70 cells as one string ("." empty, a–f a gem, "#" a stone, a capital
 *     letter = matched and about to pop), the next row, how far the stack has risen (0–1),
 *     alive, score, stones sent, stones waiting, chain, rows risen, cursor. Also `n` (name),
 *     `c` (color) and `hb` (heartbeat).
 *   - The HOST (lowest live sessionId) runs the match in ONE shared field, `match`: {id, v,
 *     ph, seed, startAt, players, bots, out, winner, endsAt, ready}. It reads every board,
 *     marks who is out and calls the winner. Bots' boards live in the shared field `bots`.
 *   - Chains and big matches send stones with a "junk" event {to, n, m, f}. The victim
 *     drops them onto its OWN board a moment later; stones you send first cancel them.
 *   - Everyone starts from the same board, and rising rows come from match.seed.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "best-score": each player's best match.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // bots fill the match up to this many boards (2–4)
  cols: 7, rows: 10,    // board size in cells
  kinds: 5,             // how many gem kinds are in play (3–6; more is harder)
  startRows: 4,         // rows of gems on the board at the start
  riseMs: 5500,         // the stack rises one row this often at the start…
  speedUpEvery: 15000,  // …and gets faster every 15 seconds…
  speedUp: 0.86,        // …by this factor…
  minRiseMs: 1300,      // …down to this
  graceMs: 1600,        // a stack touching the top survives this long before it's out
  swapMs: 90,           // a swap slides this long
  clearMs: 380,         // matched gems flash this long, then pop
  fallMs: 60,           // falling speed (ms per row, roughly)
  junkPerChain: 3,      // stones sent per chain step after the first (chain ×2 = 3, ×3 = 6)
  junkPerExtra: 1,      // stones sent per gem beyond 3 popped at once
  junkDelayMs: 1600,    // stones wait this long above a board before they drop
  maxJunk: 14,          // at most this many stones drop at once (two rows)
  points: 10,           // points per gem, times the chain
  countdownMs: 3000,    // 3, 2, 1, go
  overMs: 9000,         // the results screen
  botThinkMs: 1200,     // a bot makes a move about this often (lower is faster)
  botAimMs: 260,        // its cursor rests on the gem this long before it swaps
  botMistake: 0.3,      // chance a bot plays a weaker move
  board: "best-score",  // leaderboard name
};
const BOT_NAMES = ["Gemma", "Rubix", "Sparkle", "Jewel Bot", "Facet", "Glint", "Opal", "Cascade"];
const COLORS = ["#ffd23f", "#4cc9f0", "#f72585", "#80ed99", "#ff9f1c", "#b388ff", "#ff6b6b", "#00f5d4"];

// ── GEMS ────────────────────────────────────────────────────────────────────────────
// Each gem kind is a letter on the wire. A different shape per color keeps them readable.
const GEMS = {
  a: { color: "#ff4d6d", dark: "#9c1238", shape: "circle" },
  b: { color: "#ffbe3d", dark: "#a55f00", shape: "square" },
  c: { color: "#3ddc84", dark: "#0f7a45", shape: "triangle" },
  d: { color: "#4cc9f0", dark: "#155e9e", shape: "diamond" },
  e: { color: "#b98cff", dark: "#5428a8", shape: "hexagon" },
  f: { color: "#ff8fd8", dark: "#a72f78", shape: "star" },
};
const gemKinds = () => Object.keys(GEMS).slice(0, Math.max(3, Math.min(6, CONFIG.kinds)));
const isGem = (ch) => ch >= "a" && ch <= "f";
const isPopping = (ch) => ch >= "A" && ch <= "F";

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'match-3-duel',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field (shared or a player's), parsed once per change. Read-only. */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(last && performance.now() - last > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── BOARD ───────────────────────────────────────────────────────────────────────────
// grid[row][col]: row 0 is the top. "." empty, "a"–"f" a gem, "#" a stone, "A"–"F" popping.
// mv[row][col] is that cell's animation: it slides in from (ox, oy) cells away, or pops in.
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const emptyRow = () => Array(CONFIG.cols).fill(".");
const emptyGrid = () => Array.from({ length: CONFIG.rows }, emptyRow);
const noMoves = () => Array.from({ length: CONFIG.rows }, () => Array(CONFIG.cols).fill(null));
/** Row number k of the stack, from the match seed. It never makes a match with its two neighbors. */
function makeRow(seed, k, near1, near2) {
  const rnd = mulberry32((seed ^ Math.imul(k + 1000, 0x9e3779b1)) >>> 0), kinds = gemKinds(), row = [];
  for (let c = 0; c < CONFIG.cols; c++) {
    let g, tries = 0;
    do g = kinds[Math.floor(rnd() * kinds.length)];
    while (tries++ < 30 && ((c >= 2 && row[c - 1] === g && row[c - 2] === g) || (near1 && near2 && near1[c] === g && near2[c] === g)));
    row.push(g);
  }
  return row;
}
function newBoard(seed) {
  const R = CONFIG.rows, B = { seed, grid: emptyGrid(), mv: noMoves(), phase: "idle", t: 0, chain: 0, rise: 0, grace: 0, k: 0, next: null, alive: true, score: 0, sent: 0, pending: [], cur: null };
  const rnd = mulberry32(seed), n = Math.min(R - 2, CONFIG.startRows + 1);
  for (let i = 0; i < n; i++) B.grid[R - 1 - i] = makeRow(seed, -1 - i, B.grid[R - i], B.grid[R + 1 - i]);
  for (let c = 0; c < CONFIG.cols; c++) { // uneven tops, the same for everyone
    const h = CONFIG.startRows - 1 + Math.floor(rnd() * 3);
    for (let r = 0; r < R - h; r++) B.grid[r][c] = ".";
  }
  B.next = makeRow(seed, 0, B.grid[R - 1], B.grid[R - 2]);
  return B;
}
/** Gems and gaps slide sideways; up and down only gem with gem. Stones never move. */
function canSwap(B, r, c, r2, c2) {
  if (!B.alive || B.phase !== "idle" || r2 < 0 || c2 < 0 || r2 >= CONFIG.rows || c2 >= CONFIG.cols || r < 0 || c < 0) return false;
  const a = B.grid[r][c], b = B.grid[r2][c2];
  if (a === "#" || b === "#" || (a === "." && b === ".")) return false;
  return r === r2 || (a !== "." && b !== ".");
}
function swap(B, r, c, r2, c2, now) {
  if (!canSwap(B, r, c, r2, c2)) return false;
  [B.grid[r][c], B.grid[r2][c2]] = [B.grid[r2][c2], B.grid[r][c]];
  B.mv[r][c] = { ox: c2 - c, oy: r2 - r, t0: now, dur: CONFIG.swapMs };
  B.mv[r2][c2] = { ox: c - c2, oy: r - r2, t0: now, dur: CONFIG.swapMs };
  B.phase = "settle"; B.t = now + CONFIG.swapMs;
  return true;
}
/** Drop everything into the gaps below it. Returns how long the longest fall takes (0 = nothing moved). */
function gravity(B, now) {
  let longest = 0;
  for (let c = 0; c < CONFIG.cols; c++) {
    for (let r = CONFIG.rows - 1, to = CONFIG.rows - 1; r >= 0; r--) {
      const ch = B.grid[r][c];
      if (ch === ".") continue;
      if (r !== to) {
        const d = to - r, dur = CONFIG.fallMs * (1 + Math.sqrt(d) * 1.5);
        B.grid[to][c] = ch; B.grid[r][c] = "."; B.mv[to][c] = { ox: 0, oy: -d, t0: now, dur, fall: true }; B.mv[r][c] = null;
        longest = Math.max(longest, dur);
      }
      to--;
    }
  }
  return longest;
}
/** Every cell in a line of 3+ same gems, across or down, as row * cols + col. */
function findMatches(g) {
  const C = CONFIG.cols, R = CONFIG.rows, hit = new Set();
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const ch = g[r][c];
    if (!isGem(ch)) continue;
    if (c + 2 < C && g[r][c + 1] === ch && g[r][c + 2] === ch) for (let k = c; k < C && g[r][k] === ch; k++) hit.add(r * C + k);
    if (r + 2 < R && g[r + 1][c] === ch && g[r + 2][c] === ch) for (let k = r; k < R && g[k][c] === ch; k++) hit.add(k * C + c);
  }
  return [...hit];
}
const topFull = (B) => B.grid[0].some((ch) => ch !== ".");
/**
 * One board's rules, every frame. Phases: "idle" (you can swap; the stack rises; stones
 * drop) → "settle" (wait for slides, then fall, then look for matches) → "clear" (matched
 * gems flash, then pop) → "settle" again: each new match in a row is one more chain step.
 * Returns what happened (for sounds, effects and sending stones), or null.
 */
function stepBoard(B, now, dt, riseMs) {
  if (!B.alive) return null;
  if (B.phase === "settle") {
    if (now < B.t) return null;
    const fall = gravity(B, now);
    if (fall) { B.t = now + fall; return null; }
    const hit = findMatches(B.grid);
    if (!hit.length) { B.phase = "idle"; B.chain = 0; return null; }
    B.chain++;
    for (const i of hit) { const r = Math.floor(i / CONFIG.cols), c = i % CONFIG.cols; B.grid[r][c] = B.grid[r][c].toUpperCase(); }
    B.phase = "clear"; B.t = now + CONFIG.clearMs;
    return { matched: hit.length, chain: B.chain };
  }
  if (B.phase === "clear") return now >= B.t ? popMatched(B, now) : null;
  if (B.pending.length && now >= B.pending[0].at) return dropStones(B, now);
  if (B.rise >= 1 && topFull(B)) { // touching the top: clear something fast
    B.grace += dt * 1000;
    if (B.grace >= CONFIG.graceMs) { B.alive = false; return { ko: true }; }
    return null;
  }
  B.grace = 0;
  B.rise += (dt * 1000) / riseMs;
  if (B.rise >= 1 && !topFull(B)) { B.rise -= 1; riseRow(B); B.phase = "settle"; B.t = now; }
  return null;
}
/** The next row comes up from below: everything moves up one. */
function riseRow(B) {
  B.grid.shift(); B.grid.push(B.next);
  B.mv.shift(); B.mv.push(Array(CONFIG.cols).fill(null));
  B.k++;
  B.next = makeRow(B.seed, B.k, B.grid[CONFIG.rows - 1], B.grid[CONFIG.rows - 2]);
  if (B.cur) B.cur = [Math.max(0, B.cur[0] - 1), B.cur[1]];
}
/** Pop the flashing gems, crack the stones next to them into gems, score, and work out the stones to send. */
function popMatched(B, now) {
  const popped = [], kinds = gemKinds();
  for (let r = 0; r < CONFIG.rows; r++) for (let c = 0; c < CONFIG.cols; c++) if (isPopping(B.grid[r][c])) { popped.push([r, c, B.grid[r][c].toLowerCase()]); B.grid[r][c] = "."; B.mv[r][c] = null; }
  for (const [r, c] of popped) for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    if (B.grid[r + dr]?.[c + dc] !== "#") continue;
    B.grid[r + dr][c + dc] = kinds[Math.floor(Math.random() * kinds.length)];
    B.mv[r + dr][c + dc] = { pop: true, t0: now, dur: 240 };
  }
  B.score += popped.length * CONFIG.points * B.chain;
  const send = Math.max(0, popped.length - 3) * CONFIG.junkPerExtra + (B.chain - 1) * CONFIG.junkPerChain;
  B.phase = "settle"; B.t = now;
  return { popped, count: popped.length, chain: B.chain, send };
}
/** Stones that are due fall onto the tops of the columns, spread out. No room = the board is full = out. */
function dropStones(B, now) {
  let n = 0;
  while (B.pending.length && now >= B.pending[0].at && n < CONFIG.maxJunk) { const p = B.pending[0], k = Math.min(p.n, CONFIG.maxJunk - n); n += k; p.n -= k; if (!p.n) B.pending.shift(); }
  const tops = Array.from({ length: CONFIG.cols }, (_, c) => { let r = 0; while (r < CONFIG.rows && B.grid[r][c] === ".") r++; return r; });
  let c = Math.floor(Math.random() * CONFIG.cols), longest = 0;
  for (let i = 0; i < n; i++) {
    let tries = 0;
    while (tops[c] === 0 && tries++ < CONFIG.cols) c = (c + 1) % CONFIG.cols;
    if (tops[c] === 0) { B.alive = false; return { ko: true, junk: n }; }
    const r = --tops[c], delay = i * 25, dur = CONFIG.fallMs * (1 + Math.sqrt(r + 2) * 1.5);
    B.grid[r][c] = "#"; B.mv[r][c] = { ox: 0, oy: -(r + 2), t0: now + delay, dur, fall: true };
    longest = Math.max(longest, delay + dur);
    c = (c + 1) % CONFIG.cols;
  }
  B.phase = "settle"; B.t = now + longest;
  return { junk: n };
}
const waiting = (B) => B.pending.reduce((a, p) => a + p.n, 0);
/** A board as it goes on the wire: one short JSON string. */
const packBoard = (B, m, cur = B.cur) => JSON.stringify({ m, g: B.grid.map((row) => row.join("")).join(""), n: B.next.join(""), r: Math.round(B.rise * 100) / 100, a: B.alive ? 1 : 0, s: B.score, j: B.sent, q: waiting(B), c: B.chain, k: B.k, u: cur || 0 });
const unpackGrid = (str) => Array.from({ length: CONFIG.rows }, (_, r) => [...String(str || "").slice(r * CONFIG.cols, (r + 1) * CONFIG.cols).padEnd(CONFIG.cols, ".")]);
const riseMsAt = (m) => Math.max(CONFIG.minRiseMs, CONFIG.riseMs * CONFIG.speedUp ** Math.floor(Math.max(0, Date.now() - m.startAt) / CONFIG.speedUpEvery));

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, was: false, bots: new Map(), botsRaw: "", lastBots: 0 };
function match() {
  const m = cached("match", S.shared.match, null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const nameOf = (m, id) => (id === net.sessionId ? myName : m?.bots.find((b) => b.i === id)?.n) || String(S.entities.players?.[id]?.n ?? "Player").slice(0, 12);
const colorOf = (m, id) => (id === net.sessionId ? myColor : m?.bots.find((b) => b.i === id)?.c) || S.entities.players?.[id]?.c || "#aaa";
const isBot = (m, id) => !!m && m.bots.some((b) => b.i === id);
const newBot = (B, wait = 0) => ({ B, plan: null, nextAt: performance.now() + wait + Math.random() * CONFIG.botThinkMs, mistake: CONFIG.botMistake }); // a random first think, so bots don't all move at once

function newMatch(id) {
  const hs = humans().slice(0, CONFIG.seats), used = new Set(hs.map((h) => colorOf(null, h))), free = COLORS.filter((c) => !used.has(c)), names = [...BOT_NAMES].sort(() => Math.random() - 0.5);
  const bots = Array.from({ length: Math.max(hs.length ? 0 : 1, CONFIG.seats - hs.length) }, (_, k) => ({ i: "bot" + (k + 1), n: names[k], c: free[k % free.length] }));
  const seed = (Math.random() * 1e9) | 0;
  host.bots = new Map(bots.map((b) => [b.i, newBot(newBoard(seed), CONFIG.countdownMs)]));
  return { id, ph: "count", seed, startAt: Date.now() + CONFIG.countdownMs, players: [...hs, ...bots.map((b) => b.i)], bots, out: [], winner: "", endsAt: 0, ready: [] };
}
/** Become host: take the bots' boards over exactly as state has them. */
function adopt() {
  host.was = true; host.last = null; host.bots = new Map();
  const m = match();
  if (!m) return;
  for (const v of cached("bots", S.shared.bots, [])) if (v.m === m.id) host.bots.set(v.i, newBot(boardFromView(v, m.seed)));
  for (const b of m.bots) if (!host.bots.has(b.i)) host.bots.set(b.i, newBot(newBoard(m.seed)));
}
function boardFromView(v, seed) {
  const B = newBoard(seed), now = performance.now();

  ctx.lineWidth = sp.big ? 3 : 2; ctx.strokeStyle = danger ? `rgba(255,70,90,${0.5 + pulse * 0.5})` : color; ctx.stroke();
  if (danger) { ctx.fillStyle = `rgba(255,60,80,${0.06 + pulse * 0.08})`; ctx.fillRect(x, y, w, s * 2); }
  ctx.fillStyle = "#ffffff08";
  for (let i = 0; i < C; i += 2) ctx.fillRect(x + i * s, y, s, h); // column stripes
  if (V) {
    const oy = -V.rise * s;
    ctx.save(); ctx.beginPath(); ctx.rect(x - pad, y - s * 1.1, w + pad * 2, h + s * 1.1 + pad); ctx.clip();
    if (V.next && V.next.length) { ctx.globalAlpha = 0.32; V.next.forEach((ch, c) => { if (GEMS[ch]) ctx.drawImage(sprite(ch, s), x + c * s, y + h + oy, s, s); }); ctx.globalAlpha = 1; }
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const ch = V.grid[r][c];
      if (ch === ".") continue;
      const [dx, dy, sc] = cellAnim(V.mv[r][c], now), px = x + (c + dx) * s, py = y + (r + dy) * s + oy;
      if (isPopping(ch)) {
        const k = 1 + 0.14 * Math.sin(now / 40);
        ctx.drawImage(sprite(ch.toLowerCase(), s), px + (s * (1 - k)) / 2, py + (s * (1 - k)) / 2, s * k, s * k);
        ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now / 35); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(px + s * 0.1, py + s * 0.1, s * 0.8, s * 0.8, s * 0.25); ctx.fill(); ctx.globalAlpha = 1;
      } else ctx.drawImage(sprite(ch, s), px + (s * (1 - sc)) / 2, py + (s * (1 - sc)) / 2, s * sc, s * sc);
    }
    const cur = view.id === net.sessionId && !ATTRACT ? (me.sel || (me.kb ? V.cur : null)) : V.cur;
    if (cur && V.alive && !view.out) {
      ctx.strokeStyle = view.id === net.sessionId ? "#ffffff" : color; ctx.lineWidth = Math.max(1.5, s * 0.08);
      ctx.beginPath(); ctx.roundRect(x + cur[1] * s + 1, y + cur[0] * s + oy + 1, s - 2, s - 2, s * 0.22); ctx.stroke();
      if (view.id === net.sessionId && me.grab) { ctx.fillStyle = "#ffffff22"; ctx.fill(); }

  }
  const q = V ? (V.pending ? waiting(V) : V.q || 0) : 0;
  if (q > 0) { // stones on their way

    for (let i = 0; i < shown; i++) ctx.drawImage(sprite("#", ss), x + w - (i + 1) * (ss + 2), y - pad - ss - 4 + Math.sin(now / 90 + i) * 1.5, ss, ss);
    ctx.fillStyle = "#ff5a6e"; ctx.font = `800 ${sp.big ? 14 : 10}px system-ui, sans-serif`; ctx.textAlign = "right";
    ctx.fillText(`+${q}`, x + w - shown * (ss + 2) - 4, y - pad - 6);
  }
  ctx.textAlign = "left"; ctx.fillStyle = color; ctx.font = `800 ${sp.big ? 16 : 11}px system-ui, sans-serif`;
  if (!(q > 0) || sp.big) ctx.fillText(view.id === net.sessionId ? "You" : view.name, x, y - pad - (sp.big ? 10 : 6));
  ctx.fillStyle = "#cfc8f5"; ctx.font = `600 ${sp.big ? 13 : 10}px system-ui, sans-serif`; ctx.textAlign = "center";
  ctx.fillText(`${V ? V.score : 0} pts${sp.big ? ` · ${V ? V.sent : 0} stones sent` : ""}`, x + w / 2, y + h + pad + (sp.big ? 18 : 12));
  if (view.out || (V && !V.alive)) {
    ctx.fillStyle = "#0c0a1dbb"; ctx.fillRect(x - pad, y - pad, w + pad * 2, h + pad * 2);
    ctx.fillStyle = "#ff5a6e"; ctx.font = `900 ${Math.max(16, s * 1.6)}px system-ui, sans-serif`; ctx.fillText("KO", x + w / 2, y + h / 2 + s * 0.5);
  }
}
function drawBackground(now) {
  const grd = ctx.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "#1d1250"); grd.addColorStop(1, "#0a0818");
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 36; i++) { // slow rising sparkles
    const x = ((i * 0.6180339) % 1) * W, y = H - ((((i * 0.37) % 1) * H + now * (0.008 + (i % 5) * 0.003)) % (H + 20)), a = 0.15 + 0.15 * Math.sin(now / 600 + i);
    ctx.fillStyle = `rgba(200,180,255,${a})`; ctx.fillRect(x, y, 2, 2);

}
function draw(m, now, dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(now);
  if (!m) return;
  const views = boardViews(m, now), spots = layout(views);
  fx.spots = spots;
  for (const view of views) {
    const V = view.V;
    if (V && V.target !== undefined) V.rise = Math.abs(V.target - V.rise) > 0.5 ? V.target : V.rise + (V.target - V.rise) * Math.min(1, dt * 12);
    drawBoard(view, spots.get(view.id), now, view.id === net.sessionId);
  }
  for (const p of fx.pops) { // popped gems burst into shards
    const sp = spots.get(p.id), V = views.find((v) => v.id === p.id)?.V;
    if (sp) for (const [r, c, ch] of p.cells) for (let i = 0; i < (sp.big ? 7 : 3); i++) fx.parts.push({ x: sp.x + (c + 0.5) * sp.cell, y: sp.y + (r + 0.5 - (V ? V.rise : 0)) * sp.cell, vx: (Math.random() - 0.5) * (sp.big ? 380 : 160), vy: -Math.random() * (sp.big ? 320 : 140), life: 1, c: GEMS[ch]?.color || "#fff", s: sp.big ? 5 : 3 });
  }
  fx.pops = [];
  for (const a of fx.attacks) { // stones flying from one board to another
    const k = (now - a.at) / 520, from = spots.get(a.from), to = spots.get(a.to);
    if (k > 1 || !from || !to) continue;
    const fxp = from.x + (from.cell * CONFIG.cols) / 2, fyp = from.y + from.cell * 4, tx = to.x + (to.cell * CONFIG.cols) / 2, ty = to.y;
    const px = fxp + (tx - fxp) * easeOut(k), py = fyp + (ty - fyp) * k - Math.sin(k * Math.PI) * 90, ss = 16;
    for (let i = 0; i < Math.min(6, a.n); i++) ctx.drawImage(sprite("#", ss), px - ss / 2 + i * 5 - 12, py - ss / 2 - i * 5, ss, ss);
    if (k > 0.92 && !a.hit) { a.hit = true; for (let i = 0; i < 10; i++) fx.parts.push({ x: tx, y: ty, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 250, life: 1, c: "#9a95b8", s: 4 }); }
  }
  for (let i = fx.parts.length - 1; i >= 0; i--) {
    const p = fx.parts[i]; p.life -= dt * 1.6; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) { fx.parts.splice(i, 1); continue; }
    ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);

    if (!sp || k > 1) continue;
    const size = Math.max(14, sp.cell * (sp.big ? 0.75 : 0.9)) * (k < 0.15 ? 0.6 + k * 2.7 : 1);
    ctx.globalAlpha = 1 - k * k; ctx.font = `900 ${size}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.strokeStyle = "#0c0a1d";
    const tx = sp.x + (sp.cell * CONFIG.cols) / 2, ty = sp.y + sp.cell * CONFIG.rows * 0.42 - k * 40;
    ctx.strokeText(t.text, tx, ty); ctx.fillStyle = t.color; ctx.fillText(t.text, tx, ty);
  }
  ctx.globalAlpha = 1;
  fx.attacks = fx.attacks.filter((a) => now - a.at < 600); fx.texts = fx.texts.filter((t) => now - t.at < 1000); fx.shake *= 0.86;
  const t = Date.now();
  if (m.ph === "count") { const n = Math.ceil((m.startAt - t) / 1000); big(n > 0 ? String(n) : "GO!", "#ffd23f"); }
  else if (m.ph === "play" && t - m.startAt < 700) big("GO!", "#80ed99");
  else if (m.ph === "play" && !m.players.includes(net.sessionId) && !ATTRACT) big("Watching", "#cfc8f5", "You'll play in the next match", 36, SAFE_TOP + 60);
}
function big(text, color, sub, size = Math.min(96, W * 0.16), y = H * 0.45) {
  ctx.textAlign = "center"; ctx.font = `900 ${size}px system-ui, sans-serif`;
  ctx.lineWidth = 8; ctx.strokeStyle = "#0c0a1d"; ctx.strokeText(text, W / 2, y); ctx.fillStyle = color; ctx.fillText(text, W / 2, y);
  if (sub) { ctx.font = "700 15px system-ui, sans-serif"; ctx.strokeStyle = "#0c0a1d"; ctx.lineWidth = 4; ctx.strokeText(sub, W / 2, y + 26); ctx.fillStyle = "#fff"; ctx.fillText(sub, W / 2, y + 26); }
}

// ── SCREENS ─────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let AC = null;
function unlockAudio() { if (!AC && !ATTRACT) try { AC = new AudioContext(); } catch {} }
function tone(f, ms, type = "sine", vol = 0.05) {
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + ms / 1000);
}
let overFor = -1, board = null;
function hud(m) {
  const n = humans().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the match" : ""}`;
  if (!m) return;
  const early = m.ph === "count" || (m.ph === "play" && Date.now() - m.startAt < 14000 && m.id <= 2);
  $("hint").textContent = ATTRACT || !early ? "" : touchUI ? "Drag a gem onto its neighbor to swap · match 3 · chains drop stones on rivals" : "Drag (or click two) gems to swap · arrows + Space work too · match 3 · chains drop stones on rivals";
  $("over").hidden = m.ph !== "over" || ATTRACT;
  if (m.ph !== "over") return;
  const views = boardViews(m, performance.now()), scoreIn = (id) => views.find((x) => x.id === id)?.V?.score || 0;
  const rank = (id) => (id === m.winner ? 1e9 : m.out.includes(id) ? m.out.indexOf(id) - 1e6 : scoreIn(id)); // winner, then boards still in, then the last ones out
  const place = [...m.players].sort((a, b) => rank(b) - rank(a));
  $("oTitle").textContent = !m.winner ? "Draw!" : m.winner === net.sessionId ? "You win!" : `${nameOf(m, m.winner)} wins!`;
  const html = place.map((id) => `<li class="${id === net.sessionId ? "me" : ""}">${esc(nameOf(m, id))}<span>${scoreIn(id)} pts</span></li>`).join("");
  if ($("places").innerHTML !== html) $("places").innerHTML = html;
  $("oNext").textContent = `Next match in ${Math.max(0, Math.ceil((m.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = m.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (overFor === m.id) return;
  overFor = m.id;
  const list = $("board"), score = me.B && me.m === m.id ? me.B.score : 0;
  if (m.winner === net.sessionId) tone(660, 400, "triangle", 0.07);
  if (!board) { list.innerHTML = '<li class="msg">Leaderboards need a connection.</li>'; return; }
  list.innerHTML = '<li class="msg">Loading…</li>';
  (score > 0 ? board.submit(score).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : '<li class="msg">No scores yet. Make a chain!</li>';
  }).catch(() => { list.innerHTML = '<li class="msg">Couldn\'t load the leaderboard.</li>'; });
}
$("again").addEventListener("click", () => { if (isHost()) onReady(net.sessionId); else net.send("ready", { r: 1 }); });

/** Two players picked one color (they joined at once), or a bot has mine: the later sessionId picks another. */
function fixColor() {
  const ps = S.entities.players || {}, m = match(), botColors = (m?.bots || []).map((b) => b.c);
  if (!Object.entries(ps).some(([id, p]) => id < net.sessionId && p.c === myColor) && !botColors.includes(myColor)) return;
  const taken = new Set([...Object.entries(ps).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor;
  net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches;
/** The cell of my board under the pointer, through the same layout and rise the frame was drawn with. */
function cellAt(e) {
  const sp = fx.spots.get(net.sessionId), B = me.B;
  if (!sp || !B) return null;
  const c = Math.floor((e.clientX - sp.x) / sp.cell), r = Math.floor((e.clientY - (sp.y - B.rise * sp.cell)) / sp.cell);
  return r >= 0 && c >= 0 && r < CONFIG.rows && c < CONFIG.cols ? [r, c] : null;

const drag = { id: -1, at: null, x: 0, y: 0, done: false, prev: null };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio(); me.kb = false; me.grab = false;
  const at = cellAt(e);
  if (!at || !canPlay()) return;
  Object.assign(drag, { id: e.pointerId, at, x: e.clientX, y: e.clientY, done: false, prev: me.sel });

});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerId !== drag.id || drag.done) return;
  const step = (fx.spots.get(net.sessionId)?.cell || 40) * 0.42, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < step) return;
  const [r, c] = drag.at, [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
  drag.done = true; me.sel = null;
  doSwap(r, c, r + dr, c + dc);
});
cv.addEventListener("pointerup", (e) => {
  if (e.pointerId !== drag.id) return;
  drag.id = -1;
  if (drag.done) return;
  const [r, c] = drag.at, p = drag.prev; // a tap: pick a gem, then tap a neighbor to swap
  if (p && Math.abs(p[0] - r) + Math.abs(p[1] - c) === 1) { me.sel = null; doSwap(p[0], p[1], r, c); }
  else if (p && p[0] === r && p[1] === c) me.sel = null;
});
cv.addEventListener("pointercancel", () => { drag.id = -1; });
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // a right-click on the board doesn't open the browser menu
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });
// Keyboard: arrows move a cursor; Space picks the gem up; an arrow then swaps it that way.
const DIRS = { ArrowLeft: [0, -1], a: [0, -1], ArrowRight: [0, 1], d: [0, 1], ArrowUp: [-1, 0], w: [-1, 0], ArrowDown: [1, 0], s: [1, 0] };
addEventListener("keydown", (e) => {
  if (e.target.closest?.("button")) return; // Enter / Space on "Play again" press the button
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key, dir = DIRS[key];
  if (!dir && key !== " " && key !== "Enter") return;
  e.preventDefault(); unlockAudio();
  if (!canPlay()) return;
  const B = me.B; me.kb = true; me.sel = null;
  if (!B.cur) B.cur = [5, 3];
  if (!dir) { me.grab = !me.grab; return; }
  const [r, c] = B.cur, r2 = Math.max(0, Math.min(CONFIG.rows - 1, r + dir[0])), c2 = Math.max(0, Math.min(CONFIG.cols - 1, c + dir[1]));
  if (me.grab) { me.grab = false; if (doSwap(r, c, r2, c2)) B.cur = [r2, c2]; }
  else B.cur = [r2, c2];

});

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let lastHb = 0, lastHud = 0, last = 0;
function frame() {
  requestAnimationFrame(frame);
  const t = performance.now(), dt = Math.max(0, Math.min(0.05, (t - (last || t)) / 1000));
  if (last && t - last > 1000) { wakeHold = t + 700; host.was = false; host.last = null; } // woke from a freeze or a background tab: another player may have run the match meanwhile, so let their state arrive, then adopt it like a new host
  last = t;
  if (t - lastHb > 1000) { lastHb = t; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(Date.now(), t, dt); else host.was = false;
  const m = match();
  if (m) myTick(m, t, dt);
  draw(m, t, dt);
  if (t - lastHud > 150) { lastHud = t; hud(m); }
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { countdownMs: 200, startRows: 7, riseMs: 1500, speedUpEvery: 6000, botThinkMs: 420, botAimMs: 120, botMistake: 0.25, junkPerChain: 4, junkPerExtra: 2, junkDelayMs: 700, overMs: 3000 });
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { lastHud = 0; });
  net.on("junk", (msg, from) => { const m = match(); if (msg && m && msg.m === m.id) { fx.attacks.push({ from: msg.f || from, to: msg.to, n: msg.n, at: performance.now() }); receiveStones(m, msg.to, Math.max(0, Math.min(CONFIG.maxJunk * 2, msg.n | 0))); } });

  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { // the preview: four bots on tall stacks, so chains and stones start at once
    writeMatch(newMatch(1)); host.was = true;
    host.bots.get("bot1").mistake = 0.1; // the big board in the preview plays a little better
  }
  requestAnimationFrame(frame);
})();
</script>
